<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Evergain Avenue — Book Indoor Football Slots Online</title>
    <meta
      name="description"
      content="Book your indoor football slot at Evergain Avenue in 3 taps. See live availability, get last-minute discounts, and pay securely online."
    />
    <meta name="theme-color" content="#16a34a" />

    <!-- Declare light + dark support early to avoid a flash of un-themed content -->
    <meta name="color-scheme" content="light dark" />
    <script>
      {
        // Two-state theme: system default, or a pinned override saved in localStorage.
        const pinned = localStorage.getItem('color-scheme');
        if (pinned === 'light' || pinned === 'dark') {
          document.documentElement.dataset.theme = pinned;
          document.querySelector('meta[name="color-scheme"]').content = pinned;
        }
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
